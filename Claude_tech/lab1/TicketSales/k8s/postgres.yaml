apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-primary-data
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-primary
  labels:
    app: postgres-primary
    tier: database
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres-primary
  template:
    metadata:
      labels:
        app: postgres-primary
        tier: database
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: ticketsales
            - name: POSTGRES_USER
              value: ticketsales
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ticketsales-db
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "ticketsales", "-d", "ticketsales"]
            periodSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-primary-data
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-primary
  labels:
    tier: database
spec:
  type: ClusterIP
  selector:
    app: postgres-primary
  ports:
    - port: 5432
      targetPort: 5432
      protocol: TCP
---
